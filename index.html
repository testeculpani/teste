<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Assistência - Gabinetes e Peças</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-2: #60a5fa;
      --ok: #16a34a;
      --warn: #ea580c;
      --off: #dc2626;
      --soft: #f9fafb;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1180px, calc(100% - 20px));
      margin: 16px auto 30px;
    }

    .header {
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: none;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
    }

    .btn-soft {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid var(--line);
    }

    .helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .save-status {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 190px 190px;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }

    .card-image {
      height: 180px;
      background: var(--soft);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--line);
    }

    .status-open { color: var(--warn); }
    .status-progress { color: var(--accent); }
    .status-done { color: var(--ok); }

    .card-body {
      padding: 14px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }

    .subinfo {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .desc {
      color: #374151;
      font-size: 14px;
      line-height: 1.5;
      min-height: 70px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .meta-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .meta-box b {
      display: block;
      margin-bottom: 4px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .mini {
      padding: 11px 10px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 26px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fff;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .container { width: min(100% - 12px, 1180px); }
      .panel, .header { padding: 14px; }
      .toolbar, .card-actions, .meta-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="header">
      <h1>Cadastro de assistência técnica</h1>
      <p>Protótipo para registrar informações de gabinetes e peças gerais com imagem e descrição do atendimento.</p>
    </section>

    <section class="layout">
      <div class="panel">
        <h2>Novo cadastro</h2>
        <form id="assistForm" class="form-grid">
          <label>
            Imagem
            <input type="file" id="photoInput" accept="image/*" />
            <img id="preview" class="preview" alt="Prévia da imagem" />
          </label>

          <label>
            Cliente ou empresa
            <input type="text" id="clientInput" placeholder="Nome do cliente ou empresa" required />
          </label>

          <label>
            Produto / peça
            <input type="text" id="itemInput" placeholder="Ex.: gabinete, fonte, cooler, placa" required />
          </label>

          <label>
            Número / código
            <input type="text" id="codeInput" placeholder="Nº da OS, patrimônio ou código interno" />
          </label>

          <label>
            Status
            <select id="statusInput">
              <option value="Aberto">Aberto</option>
              <option value="Em análise">Em análise</option>
              <option value="Concluído">Concluído</option>
            </select>
          </label>

          <label>
            Descrição
            <textarea id="descInput" placeholder="Descreva o defeito, análise, observações ou serviço realizado" required></textarea>
          </label>

          <div class="actions">
            <button class="btn-primary" id="saveBtn" type="submit">Salvar cadastro</button>
            <button class="btn-soft" id="fillDemoBtn" type="button">Preencher exemplo</button>
            <button class="btn-soft" id="clearBtn" type="button">Limpar</button>
          </div>

          <div id="saveStatus" class="save-status">Cadastro salvo com sucesso.</div>
          <div class="helper">Agora o salvamento foi ajustado para funcionar corretamente no navegador.</div>
        </form>
      </div>

      <div class="panel">
        <h2>Cadastros</h2>

        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Buscar cliente, peça ou código" />
          <select id="filterStatus">
            <option value="Todos">Todos status</option>
            <option value="Aberto">Aberto</option>
            <option value="Em análise">Em análise</option>
            <option value="Concluído">Concluído</option>
          </select>
          <select id="filterType">
            <option value="Todos">Todos itens</option>
            <option value="gabinete">Gabinete</option>
            <option value="fonte">Fonte</option>
            <option value="cooler">Cooler</option>
            <option value="placa">Placa</option>
          </select>
        </div>

        <div id="cards" class="cards"></div>
      </div>
    </section>
  </div>

  <script>
    const assistForm = document.getElementById('assistForm');
    const photoInput = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const clientInput = document.getElementById('clientInput');
    const itemInput = document.getElementById('itemInput');
    const codeInput = document.getElementById('codeInput');
    const statusInput = document.getElementById('statusInput');
    const descInput = document.getElementById('descInput');
    const fillDemoBtn = document.getElementById('fillDemoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const cards = document.getElementById('cards');
    const searchInput = document.getElementById('searchInput');
    const filterStatus = document.getElementById('filterStatus');
    const filterType = document.getElementById('filterType');
    const saveStatus = document.getElementById('saveStatus');

    let currentImage = '';
    let records = [];

    function loadData() {
      try {
        const saved = localStorage.getItem('assistenciaGabinetesRecords');
        records = saved ? JSON.parse(saved) : [];
      } catch (error) {
        records = [];
        console.error('Erro ao ler dados salvos:', error);
      }
    }

    function saveData() {
      try {
        localStorage.setItem('assistenciaGabinetesRecords', JSON.stringify(records));
        return true;
      } catch (error) {
        alert('Não foi possível salvar no navegador.');
        console.error('Erro ao salvar:', error);
        return false;
      }
    }

    function showSavedMessage(text) {
      saveStatus.textContent = text;
      saveStatus.style.display = 'block';
      clearTimeout(window.__saveTimer);
      window.__saveTimer = setTimeout(() => {
        saveStatus.style.display = 'none';
      }, 2200);
    }

    function clearForm() {
      assistForm.reset();
      statusInput.value = 'Aberto';
      preview.src = '';
      preview.style.display = 'none';
      currentImage = '';
    }

    function badgeClass(status) {
      if (status === 'Concluído') return 'status-done';
      if (status === 'Em análise') return 'status-progress';
      return 'status-open';
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        currentImage = reader.result;
        preview.src = currentImage;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    fillDemoBtn.addEventListener('click', () => {
      clientInput.value = 'Empresa Exemplo';
      itemInput.value = 'Gabinete ATX';
      codeInput.value = 'OS-1045';
      statusInput.value = 'Em análise';
      descInput.value = 'Gabinete com lateral amassada e análise de encaixe da tampa. Cliente pediu avaliação e registro com imagem.';
    });

    clearBtn.addEventListener('click', clearForm);

    assistForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const client = clientInput.value.trim();
      const item = itemInput.value.trim();
      const code = codeInput.value.trim();
      const status = statusInput.value;
      const desc = descInput.value.trim();

      if (!client) {
        alert('Digite o cliente ou empresa.');
        clientInput.focus();
        return;
      }

      if (!item) {
        alert('Digite o produto ou peça.');
        itemInput.focus();
        return;
      }

      if (!desc) {
        alert('Digite a descrição.');
        descInput.focus();
        return;
      }

      records.unshift({
        id: Date.now(),
        client,
        item,
        code,
        status,
        desc,
        image: currentImage || '',
        date: new Date().toLocaleString('pt-BR')
      });

      if (!saveData()) return;

      render();
      clearForm();
      showSavedMessage('Cadastro salvo com sucesso.');
    });

    function removeRecord(id) {
      records = records.filter(r => r.id !== id);
      if (!saveData()) return;
      render();
      showSavedMessage('Cadastro excluído.');
    }

    function copyRecord(id) {
      const item = records.find(r => r.id === id);
      if (!item) return;
      const text = `Cliente: ${item.client}
Item: ${item.item}
Código: ${item.code || '-'}
Status: ${item.status}
Descrição: ${item.desc}`;
      navigator.clipboard.writeText(text).then(() => showSavedMessage('Cadastro copiado.'));
    }

    function advanceStatus(id) {
      const item = records.find(r => r.id === id);
      if (!item) return;
      if (item.status === 'Aberto') item.status = 'Em análise';
      else if (item.status === 'Em análise') item.status = 'Concluído';
      else item.status = 'Aberto';
      if (!saveData()) return;
      render();
      showSavedMessage('Status atualizado.');
    }

    function renderCards() {
      const term = searchInput.value.trim().toLowerCase();
      const statusFilter = filterStatus.value;
      const typeFilter = filterType.value.toLowerCase();

      let filtered = records.filter(r => {
        const text = `${r.client} ${r.item} ${r.code} ${r.desc}`.toLowerCase();
        return text.includes(term);
      });

      if (statusFilter !== 'Todos') {
        filtered = filtered.filter(r => r.status === statusFilter);
      }

      if (filterType.value !== 'Todos') {
        filtered = filtered.filter(r => r.item.toLowerCase().includes(typeFilter));
      }

      if (!filtered.length) {
        cards.innerHTML = '<div class="empty">Nenhum cadastro encontrado.</div>';
        return;
      }

      cards.innerHTML = filtered.map(item => {
        const imageHtml = item.image
          ? `<img src="${item.image}" alt="${escapeHtml(item.item)}">`
          : 'Sem imagem';

        return `
          <article class="card">
            <div class="card-image">
              ${imageHtml}
              <div class="badge ${badgeClass(item.status)}">${escapeHtml(item.status)}</div>
            </div>
            <div class="card-body">
              <h3>${escapeHtml(item.item)}</h3>
              <div class="subinfo"><b>Cliente:</b> ${escapeHtml(item.client)}</div>
              <div class="desc">${escapeHtml(item.desc)}</div>
              <div class="meta-row">
                <div class="meta-box"><b>Código</b>${escapeHtml(item.code || '-')}</div>
                <div class="meta-box"><b>Data</b>${escapeHtml(item.date)}</div>
              </div>
              <div class="card-actions">
                <button class="btn-primary mini" onclick="advanceStatus(${item.id})">Trocar status</button>
                <button class="btn-soft mini" onclick="copyRecord(${item.id})">Copiar</button>
                <button class="btn-soft mini" onclick="removeRecord(${item.id})">Excluir</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function render() {
      renderCards();
    }

    searchInput.addEventListener('input', renderCards);
    filterStatus.addEventListener('change', renderCards);
    filterType.addEventListener('change', renderCards);

    window.removeRecord = removeRecord;
    window.copyRecord = copyRecord;
    window.advanceStatus = advanceStatus;

    loadData();
    render();
  </script>
</body>
</html>

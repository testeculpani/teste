<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro Rápido - Segunda Linha</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --ok: #16a34a;
      --warn: #ea580c;
      --off: #dc2626;
      --soft: #f9fafb;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1100px, calc(100% - 20px));
      margin: 16px auto 30px;
    }

    .header {
      background: linear-gradient(135deg, #fff7ed, #ffffff);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: none;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #111827;
    }

    .btn-soft {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid var(--line);
    }

    .helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }

    .card-image {
      height: 170px;
      background: var(--soft);
      position: relative;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--line);
    }

    .status-ok { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-off { color: var(--off); }

    .card-body {
      padding: 14px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      min-height: 40px;
    }

    .stock {
      margin-top: 12px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .mini {
      padding: 11px 10px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 26px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fff;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .container { width: min(100% - 12px, 1100px); }
      .panel, .header { padding: 14px; }
      .toolbar, .card-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="header">
      <h1>Cadastro rápido de produtos</h1>
      <p>Modelo simples para cadastrar foto, valor e quantidade, e depois baixar o estoque.</p>
    </section>

    <section class="layout">
      <div class="panel">
        <h2>Novo produto</h2>
        <div class="form-grid">
          <label>
            Foto
            <input type="file" id="photoInput" accept="image/*" />
            <img id="preview" class="preview" alt="Prévia da imagem" />
          </label>

          <label>
            Produto
            <input type="text" id="nameInput" placeholder="Nome do produto" />
          </label>

          <label>
            Valor
            <input type="number" id="priceInput" placeholder="0,00" step="0.01" min="0" />
          </label>

          <label>
            Quantidade
            <input type="number" id="stockInput" placeholder="0" min="0" step="1" />
          </label>

          <label>
            Observação
            <textarea id="noteInput" placeholder="Detalhe rápido do produto"></textarea>
          </label>

          <div class="actions">
            <button class="btn-primary" id="saveBtn">Salvar produto</button>
            <button class="btn-soft" id="fillDemoBtn" type="button">Preencher exemplo</button>
            <button class="btn-soft" id="clearBtn" type="button">Limpar</button>
          </div>

          <div class="helper">Pensado para o operador usar sem tela poluída.</div>
        </div>
      </div>

      <div class="panel">
        <h2>Produtos</h2>

        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Buscar produto" />
          <select id="filterSelect">
            <option value="all">Todos</option>
            <option value="available">Disponíveis</option>
            <option value="soldout">Esgotados</option>
          </select>
        </div>

        <div id="cards" class="cards"></div>
      </div>
    </section>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const nameInput = document.getElementById('nameInput');
    const priceInput = document.getElementById('priceInput');
    const stockInput = document.getElementById('stockInput');
    const noteInput = document.getElementById('noteInput');
    const saveBtn = document.getElementById('saveBtn');
    const fillDemoBtn = document.getElementById('fillDemoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const cards = document.getElementById('cards');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');

    let currentImage = '';
    let products = JSON.parse(localStorage.getItem('segundaLinhaProductsSimple') || '[]');

    function money(v) {
      return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function saveData() {
      localStorage.setItem('segundaLinhaProductsSimple', JSON.stringify(products));
    }

    function getStatus(stock) {
      if (stock <= 0) return { label: 'Esgotado', className: 'status-off' };
      if (stock <= 2) return { label: 'Poucas unid.', className: 'status-warn' };
      return { label: 'Disponível', className: 'status-ok' };
    }

    function clearForm() {
      nameInput.value = '';
      priceInput.value = '';
      stockInput.value = '';
      noteInput.value = '';
      photoInput.value = '';
      preview.src = '';
      preview.style.display = 'none';
      currentImage = '';
    }

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        currentImage = reader.result;
        preview.src = currentImage;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    fillDemoBtn.addEventListener('click', () => {
      nameInput.value = 'Grelha Inox 40cm';
      priceInput.value = '79.90';
      stockInput.value = '5';
      noteInput.value = 'Pequeno detalhe estético';
    });

    clearBtn.addEventListener('click', clearForm);

    saveBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);
      const stock = parseInt(stockInput.value, 10);
      const note = noteInput.value.trim();

      if (!name) return alert('Digite o nome do produto.');
      if (Number.isNaN(price) || price < 0) return alert('Digite um valor válido.');
      if (Number.isNaN(stock) || stock < 0) return alert('Digite uma quantidade válida.');

      products.unshift({
        id: Date.now(),
        name,
        price,
        stock,
        note,
        image: currentImage || 'https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=900&q=80'
      });

      saveData();
      render();
      clearForm();
    });

    function decreaseStock(id) {
      const item = products.find(p => p.id === id);
      if (!item || item.stock <= 0) return;
      item.stock -= 1;
      saveData();
      render();
    }

    function markSoldOut(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;
      item.stock = 0;
      saveData();
      render();
    }

    function removeProduct(id) {
      products = products.filter(p => p.id !== id);
      saveData();
      render();
    }

    function copyWhatsAppText(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;
      const text = `${item.name}
Valor: ${money(item.price)}
Quantidade: ${item.stock}
Observação: ${item.note || 'Sem observação'}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('Texto copiado.');
      });
    }

    function renderCards() {
      const term = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      let filtered = products.filter(p => p.name.toLowerCase().includes(term));

      if (filter === 'available') filtered = filtered.filter(p => p.stock > 0);
      if (filter === 'soldout') filtered = filtered.filter(p => p.stock <= 0);

      if (!filtered.length) {
        cards.innerHTML = '<div class="empty">Nenhum produto cadastrado.</div>';
        return;
      }

      cards.innerHTML = filtered.map(item => {
        const status = getStatus(item.stock);
        return `
          <article class="card">
            <div class="card-image">
              <img src="${item.image}" alt="${item.name}" />
              <div class="badge ${status.className}">${status.label}</div>
            </div>
            <div class="card-body">
              <h3>${item.name}</h3>
              <div class="price">${money(item.price)}</div>
              <div class="meta">${item.note || 'Sem observação.'}</div>
              <div class="stock">
                <span>Quantidade</span>
                <strong>${item.stock}</strong>
              </div>
              <div class="card-actions">
                <button class="btn-primary mini" onclick="decreaseStock(${item.id})">Baixar 1</button>
                <button class="btn-soft mini" onclick="copyWhatsAppText(${item.id})">Copiar</button>
                <button class="btn-soft mini" onclick="markSoldOut(${item.id})">Esgotado</button>
                <button class="btn-soft mini" onclick="removeProduct(${item.id})">Excluir</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function render() {
      renderCards();
    }

    searchInput.addEventListener('input', renderCards);
    filterSelect.addEventListener('change', renderCards);

    window.decreaseStock = decreaseStock;
    window.copyWhatsAppText = copyWhatsAppText;
    window.markSoldOut = markSoldOut;
    window.removeProduct = removeProduct;

    render();
  </script>
</body>
</html>

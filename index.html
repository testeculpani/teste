<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Máquina de Cartão</title>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0f172a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .card {
        background: #1e293b;
        padding: 25px;
        border-radius: 12px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 22px;
        color: #38bdf8;
    }

    label {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #cbd5f5;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input {
        background: #f8fafc;
    }

    select {
        background: #f8fafc;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: #020617;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0ea5e9;
    }

    .resultado {
        margin-top: 20px;
        background: #020617;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
    }

    .linha {
        display: flex;
        justify-content: space-between;
        margin: 6px 0;
    }

    .destaque {
        color: #22c55e;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Simulador Máquina de Cartão</h1>

    <label>Valor da Venda (R$)</label>
    <input type="number" id="valor" placeholder="Ex: 1500" step="0.01">

    <label>Parcelas</label>
    <select id="parcelas">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="7">7x</option>
        <option value="8">8x</option>
        <option value="9">9x</option>
        <option value="10">10x</option>
        <option value="11">11x</option>
        <option value="12">12x</option>
    </select>

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado" style="display:none;">
        <div class="linha"><span>Taxa aplicada:</span><span id="taxa"></span></div>
        <div class="linha"><span>Valor da taxa:</span><span id="valorTaxa"></span></div>
        <div class="linha"><span>Valor líquido:</span><span class="destaque" id="liquido"></span></div>
        <div class="linha"><span>Valor da parcela:</span><span id="parcelaValor"></span></div>
    </div>
</div>

<script>
const taxas = {
    1: 2.765,
    2: 4.102,
    3: 4.669,
    4: 5.241,
    5: 5.809,
    6: 6.372,
    7: 6.964,
    8: 7.516,
    9: 8.120,
    10: 8.684,
    11: 9.278,
    12: 9.878
};

function calcular() {
    const valor = parseFloat(document.getElementById('valor').value);
    const parcelas = document.getElementById('parcelas').value;

    if (!valor || valor <= 0) {
        alert("Informe um valor válido.");
        return;
    }

    const taxa = taxas[parcelas];
    const valorTaxa = valor * (taxa / 100);
    const liquido = valor - valorTaxa;
    const valorParcela = valor / parcelas;

    document.getElementById('taxa').innerText = taxa.toFixed(3) + "%";
    document.getElementById('valorTaxa').innerText = "R$ " + valorTaxa.toFixed(2);
    document.getElementById('liquido').innerText = "R$ " + liquido.toFixed(2);
    document.getElementById('parcelaValor').innerText = parcelas + "x de R$ " + valorParcela.toFixed(2);

    document.getElementById('resultado').style.display = "block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Máquina de Cartão</title>

<style>
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:#fff;
  }

  .app{
    max-width:420px;
    margin:auto;
    min-height:100vh;
    padding:16px;
    box-sizing:border-box;
  }

  h1{
    text-align:center;
    font-size:20px;
    margin-bottom:6px;
    color:#38bdf8;
  }

  .sub{
    text-align:center;
    font-size:13px;
    color:#cbd5f5;
    margin-bottom:16px;
  }

  input{
    width:100%;
    padding:14px;
    font-size:18px;
    border-radius:12px;
    border:none;
    outline:none;
    margin-bottom:10px;
  }

  .hint{
    font-size:12px;
    color:#94a3b8;
    margin-bottom:16px;
  }

  .lista{
    background:#020617;
    border-radius:14px;
    overflow:hidden;
    display:none;
  }

  .linha{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px solid rgba(148,163,184,.15);
  }

  .linha:last-child{
    border-bottom:none;
  }

  .parcela{
    font-weight:bold;
    font-size:14px;
    color:#7dd3fc;
  }

  .taxa{
    font-size:12px;
    color:#94a3b8;
  }

  .valor{
    text-align:right;
  }

  .total{
    font-weight:bold;
    color:#22c55e;
    font-size:15px;
  }

  .cada{
    font-size:12px;
    color:#cbd5f5;
  }

  .footer{
    text-align:center;
    font-size:11px;
    color:#64748b;
    margin-top:14px;
  }
</style>
</head>

<body>
<div class="app">
  <h1>Simulador de Cartão</h1>
  <div class="sub">Taxa repassada ao cliente</div>

  <input
    type="number"
    id="valorBase"
    placeholder="Valor base (ex: 1000)"
    step="0.01"
  >

  <div class="hint">
    Digite o valor que você quer receber.<br>
    A tabela abaixo já soma a taxa no cliente.
  </div>

  <div class="lista" id="lista"></div>

  <div class="footer">
    Fórmula: <b>valor × (1 + taxa)</b>
  </div>
</div>

<script>
const taxas = {
  1: 2.765,
  2: 4.102,
  3: 4.669,
  4: 5.241,
  5: 5.809,
  6: 6.372,
  7: 6.964,
  8: 7.516,
  9: 8.120,
  10: 8.684,
  11: 9.278,
  12: 9.878
};

const input = document.getElementById("valorBase");
const lista = document.getElementById("lista");

function brl(v){
  return v.toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
}

input.addEventListener("input", () => {
  const base = parseFloat(input.value);

  if(!base || base <= 0){
    lista.style.display = "none";
    lista.innerHTML = "";
    return;
  }

  let html = "";

  for(let p = 1; p <= 12; p++){
    const taxa = taxas[p] / 100;
    const total = base * (1 + taxa);
    const parcela = total / p;

    html += `
      <div class="linha">
        <div>
          <div class="parcela">${p}x</div>
          <div class="taxa">Taxa ${taxas[p].toFixed(3)}%</div>
        </div>
        <div class="valor">
          <div class="total">${brl(total)}</div>
          <div class="cada">${p}x de ${brl(parcela)}</div>
        </div>
      </div>
    `;
  }

  lista.innerHTML = html;
  lista.style.display = "block";
});
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Caixa — Simples</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
      --blue:#2563eb; --green:#16a34a; --red:#ef4444; --gray:#f1f5f9;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    header{padding:16px;max-width:980px;margin:0 auto}
    h1{margin:0;font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px}
    .wrap{max-width:980px;margin:0 auto;padding:0 16px 24px;display:grid;gap:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
    label{display:block;font-size:12px;color:var(--muted);margin:8px 0 6px}
    input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:12px;font-size:14px}
    input:focus,select:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
    .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    @media (max-width:900px){.row{grid-template-columns:1fr 1fr}}
    @media (max-width:520px){.row{grid-template-columns:1fr}}
    button{border:0;border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}
    .btnBlue{background:var(--blue);color:#fff}
    .btnGreen{background:#dcfce7;color:#14532d}
    .btnRed{background:#fee2e2;color:#991b1b}
    .btnGray{background:var(--gray);color:var(--text)}
    .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .tot{display:flex;gap:10px;flex-wrap:wrap}
    .pill{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px}
    .pill b{font-size:13px}
    table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
    thead th{background:#f8fafc;color:var(--muted);font-size:12px;text-align:left;padding:10px;border-bottom:1px solid var(--border)}
    tbody td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
    tbody tr:last-child td{border-bottom:0}
    .ok{color:var(--green);font-weight:800}
    .no{color:var(--red);font-weight:800}
    .small{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
<header>
  <h1>Controle de Caixa (Simples)</h1>
  <div class="sub">Lançar entrada → você confere com OK → se pagar/retirar, use “Zerar”.</div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <div>
        <label>Data</label>
        <input id="dt" type="date">
      </div>
      <div>
        <label>Descrição</label>
        <input id="desc" type="text" placeholder="Ex: Venda iPhone / Pix / Acessório">
      </div>
      <div>
        <label>Valor (R$)</label>
        <input id="val" type="text" inputmode="decimal" placeholder="Ex: 1299,90">
      </div>
      <div>
        <label>Onde entrou?</label>
        <select id="onde">
          <option value="caixa">Caixa (dinheiro)</option>
          <option value="conta">Conta (banco)</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <button class="btnBlue" id="add">Adicionar</button>
      <button class="btnGray" id="limpar">Limpar</button>
    </div>

    <div class="small" style="margin-top:10px">
      Regra simples: <b>não mexe em “Zerar”</b> sem você mandar. Só você decide quando pagar fornecedor/retirar.
    </div>
  </div>

  <div class="card">
    <div class="top">
      <div class="tot">
        <div class="pill">Caixa: <b id="tCaixa">R$ 0,00</b></div>
        <div class="pill">Conta: <b id="tConta">R$ 0,00</b></div>
        <div class="pill">Total: <b id="tTotal">R$ 0,00</b></div>
      </div>
      <div class="actions">
        <button class="btnRed" id="zerarCaixa">Zerar Caixa (retirei/paguei)</button>
        <button class="btnRed" id="zerarConta">Zerar Conta</button>
      </div>
    </div>

    <div style="overflow:auto;margin-top:10px">
      <table>
        <thead>
          <tr>
            <th style="width:90px">OK?</th>
            <th>Data / Descrição</th>
            <th style="width:120px">Onde</th>
            <th style="width:140px">Valor</th>
            <th style="width:220px">Ações</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const LS = "caixa_simples_v1";

  const el = id => document.getElementById(id);

  const dt = el("dt"), desc = el("desc"), val = el("val"), onde = el("onde");
  const tb = el("tb");

  function today(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
  }

  function brl(n){
    return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }

  function parseMoney(s){
    if(!s) return NaN;
    s = String(s).trim().replace(/[^\d,.-]/g,"");
    if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
    return Number(s);
  }

  function load(){
    try{
      const raw = localStorage.getItem(LS);
      if(!raw) return {items:[], caixa:0, conta:0};
      const j = JSON.parse(raw);
      if(!j.items) j.items=[];
      if(typeof j.caixa!=="number") j.caixa=0;
      if(typeof j.conta!=="number") j.conta=0;
      return j;
    }catch(e){
      return {items:[], caixa:0, conta:0};
    }
  }

  function save(){
    localStorage.setItem(LS, JSON.stringify(state));
  }

  function uid(){
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  let state = load();
  dt.value = today();

  function recalcTotals(){
    let c = 0, k = 0;
    for(const x of state.items){
      if(!x.ok) continue; // só entra no saldo quando tiver OK
      if(x.onde === "caixa") c += x.valor;
      else k += x.valor;
    }
    state.caixa = c;
    state.conta = k;
    el("tCaixa").textContent = brl(c);
    el("tConta").textContent = brl(k);
    el("tTotal").textContent = brl(c+k);
  }

  function render(){
    recalcTotals();
    save();

    tb.innerHTML = state.items.map(x => `
      <tr>
        <td>${x.ok ? '<span class="ok">OK</span>' : '<span class="no">NÃO</span>'}</td>
        <td>
          <div style="font-weight:900">${escapeHtml(x.desc)}</div>
          <div class="small">${new Date(x.dt+"T00:00:00").toLocaleDateString("pt-BR")}</div>
        </td>
        <td style="font-weight:800">${x.onde === "caixa" ? "Caixa" : "Conta"}</td>
        <td style="font-weight:900;white-space:nowrap">${brl(x.valor)}</td>
        <td>
          <div class="actions">
            <button class="btnGreen" onclick="toggleOk('${x.id}')">OK</button>
            <button class="btnGray" onclick="editItem('${x.id}')">Editar</button>
            <button class="btnRed" onclick="delItem('${x.id}')">Excluir</button>
          </div>
        </td>
      </tr>
    `).join("");

    if(!state.items.length){
      tb.innerHTML = `<tr><td colspan="5" class="small" style="padding:14px">Nenhum lançamento ainda.</td></tr>`;
    }
  }

  el("add").addEventListener("click", () => {
    const d = dt.value || today();
    const ds = desc.value.trim();
    const v = parseMoney(val.value);

    if(!ds){ alert("Preencha a descrição."); desc.focus(); return; }
    if(!Number.isFinite(v) || v <= 0){ alert("Valor inválido."); val.focus(); return; }

    state.items.unshift({
      id: uid(),
      dt: d,
      desc: ds,
      valor: Math.abs(v),
      onde: onde.value,
      ok: false
    });

    desc.value = "";
    val.value = "";
    desc.focus();
    render();
  });

  el("limpar").addEventListener("click", () => {
    dt.value = today();
    desc.value = "";
    val.value = "";
    onde.value = "caixa";
    desc.focus();
  });

  window.toggleOk = (id) => {
    const x = state.items.find(a => a.id === id);
    if(!x) return;
    x.ok = !x.ok;
    render();
  };

  window.editItem = (id) => {
    const x = state.items.find(a => a.id === id);
    if(!x) return;

    const nd = prompt("Descrição:", x.desc);
    if(nd === null) return;

    const nv = prompt("Valor (R$):", String(x.valor).replace(".",","));
    if(nv === null) return;
    const v = parseMoney(nv);
    if(!Number.isFinite(v) || v <= 0){ alert("Valor inválido."); return; }

    const no = prompt("Onde? (caixa ou conta):", x.onde);
    if(no === null) return;
    const o = no.trim().toLowerCase();
    if(o !== "caixa" && o !== "conta"){ alert("Use caixa ou conta."); return; }

    x.desc = nd.trim() || x.desc;
    x.valor = Math.abs(v);
    x.onde = o;
    render();
  };

  window.delItem = (id) => {
    const x = state.items.find(a => a.id === id);
    if(!x) return;
    if(!confirm("Excluir este lançamento?")) return;
    state.items = state.items.filter(a => a.id !== id);
    render();
  };

  // Zerar = criar um "registro de retirada" simples (sem complicar)
  el("zerarCaixa").addEventListener("click", () => {
    if(state.caixa <= 0){ alert("Caixa já está zerado."); return; }
    if(!confirm("Zerar CAIXA significa que você retirou/pagou e o dinheiro não está mais no caixa. Continuar?")) return;
    // remove do saldo: marca como não OK todos do caixa? não: melhor registrar retirada e manter histórico
    state.items.unshift({
      id: uid(),
      dt: today(),
      desc: "RETIRADA / PAGAMENTO (CAIXA) — ZERAR",
      valor: state.caixa,
      onde: "caixa",
      ok: true,
      retirada: true
    });
    // Para não complicar com saída, a gente “nega” o saldo via item espelho negativo:
    state.items.unshift({
      id: uid(),
      dt: today(),
      desc: "AJUSTE: CAIXA ZERADO",
      valor: -state.caixa,
      onde: "caixa",
      ok: true,
      ajuste: true
    });
    // Recalcular vai somar valor negativo também, então precisamos adaptar:
    // Simples: ao somar, considerar valores negativos.
    render();
  });

  el("zerarConta").addEventListener("click", () => {
    if(state.conta <= 0){ alert("Conta já está zerada."); return; }
    if(!confirm("Zerar CONTA significa que você tirou/pagou e o dinheiro não está mais na conta. Continuar?")) return;
    state.items.unshift({
      id: uid(),
      dt: today(),
      desc: "RETIRADA / PAGAMENTO (CONTA) — ZERAR",
      valor: state.conta,
      onde: "conta",
      ok: true,
      retirada: true
    });
    state.items.unshift({
      id: uid(),
      dt: today(),
      desc: "AJUSTE: CONTA ZERADA",
      valor: -state.conta,
      onde: "conta",
      ok: true,
      ajuste: true
    });
    render();
  });

  // Ajuste no cálculo pra aceitar valor negativo (por causa do zerar simples)
  function recalcTotals(){
    let c = 0, k = 0;
    for(const x of state.items){
      if(!x.ok) continue;
      const v = Number(x.valor);
      if(!Number.isFinite(v)) continue;
      if(x.onde === "caixa") c += v;
      else k += v;
    }
    state.caixa = c;
    state.conta = k;
    el("tCaixa").textContent = brl(c);
    el("tConta").textContent = brl(k);
    el("tTotal").textContent = brl(c+k);
  }

  // formatar valor ao sair do campo
  val.addEventListener("blur", () => {
    const v = parseMoney(val.value);
    if(Number.isFinite(v) && v > 0){
      val.value = v.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
    }
  });

  render();
</script>
</body>
</html>
